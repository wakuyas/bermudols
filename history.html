<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>バミューダドルフィンズ 年度別シーズン成績</title>
<style>
  :root {
    --primary: #1a3a5c; --accent: #c8102e; --gold: #d4a017;
    --bg: #f5f0e8; --card-bg: #fffef9; --border: #d4c8a8;
    --text: #2c2416; --muted: #7a6e5a;
    --win-bg: #e6f4ec; --win-cl: #1a6e3a;
    --loss-bg: #fce8e8; --loss-cl: #c8102e;
    --draw-bg: #fef9e7; --draw-cl: #b07d10;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;
         background: var(--bg); color: var(--text); min-height: 100vh; }
  .nav { background: var(--primary); padding: 10px 24px; display: flex; gap: 6px;
          flex-wrap: wrap; align-items: center; }
  .nav a { color: #a0b8d0; text-decoration: none; font-size: 13px; padding: 4px 10px;
            border-radius: 4px; transition: all .15s; }
  .nav a:hover, .nav a.active { background: rgba(255,255,255,.12); color: #fff; }
  /* year nav */
  .year-panel { background: #0d2238; padding: 0; border-bottom: 1px solid rgba(255,255,255,.08); }
  .decade-tabs { display: flex; gap: 0; overflow-x: auto; border-bottom: 1px solid rgba(255,255,255,.1); }
  .decade-tab { padding: 8px 16px; font-size: 12px; color: #6a8aaa; cursor: pointer;
                 white-space: nowrap; transition: all .15s; border-bottom: 2px solid transparent; }
  .decade-tab:hover { color: #fff; }
  .decade-tab.active { color: var(--gold); border-bottom-color: var(--gold); }
  .year-list { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 16px; }
  .year-btn { font-size: 12px; color: #7a9ab8; background: none; border: 1px solid rgba(255,255,255,.1);
               border-radius: 3px; padding: 3px 9px; cursor: pointer; transition: all .15s; }
  .year-btn:hover { background: rgba(255,255,255,.1); color: #fff; }
  .year-btn.active { background: var(--gold); color: #1a2030; font-weight: 700; border-color: var(--gold); }
  /* hero */
  .hero { background: linear-gradient(160deg,#0d2238 0%,#1a3a5c 55%,#1e4d7a 100%);
           color: #fff; padding: 36px 24px 28px; text-align: center; position: relative; overflow: hidden; }
  .hero::before { content: '⚾'; position: absolute; font-size: 280px; opacity: .04;
                   top: -40px; right: -20px; line-height: 1; pointer-events: none; }
  .hero-year  { font-size: 12px; letter-spacing: .25em; color: #a0b8d0; margin-bottom: 8px; }
  .hero-title { font-size: clamp(24px,5vw,42px); font-weight: 900; margin-bottom: 20px; }
  .hero-title span { color: var(--gold); }
  .rec-row { display: flex; justify-content: center; gap: 0; }
  .rec-item { text-align: center; padding: 10px 22px;
               border-right: 1px solid rgba(255,255,255,.15); }
  .rec-item:last-child { border-right: none; }
  .rec-num { font-size: 40px; font-weight: 900; line-height: 1; }
  .rec-lbl { font-size: 12px; color: #a0b8d0; margin-top: 4px; }
  .rec-win  { color: #5fcc88; } .rec-loss { color: #ff7a85; } .rec-draw { color: var(--gold); }
  /* main */
  .main { max-width: 1100px; margin: 0 auto; padding: 32px 24px 60px; }
  .sec-hdr { font-size: 18px; font-weight: 900; color: var(--primary);
              border-left: 4px solid var(--primary); padding-left: 12px;
              margin: 32px 0 14px; }
  .team-card { background: var(--card-bg); border: 1px solid var(--border);
                border-radius: 12px; overflow: hidden; margin-bottom: 28px; }
  .tc-head { background: var(--primary); color: #fff; padding: 10px 16px;
              font-weight: 700; font-size: 14px; }
  .tc-stats { display: flex; flex-wrap: wrap; }
  .tc-stat { padding: 14px 20px; text-align: center;
              border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .tc-val  { font-size: 22px; font-weight: 900; color: var(--primary); }
  .tc-lbl  { font-size: 10px; color: var(--muted); margin-top: 2px; }
  .tc-rate { font-size: 16px; font-weight: 900; color: var(--primary); }
  /* games table */
  .games-wrap { overflow-x: auto; margin-bottom: 28px; }
  table.games-tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.games-tbl th { background: var(--primary); color: #fff; padding: 8px 10px; text-align: center; white-space: nowrap; }
  table.games-tbl td { padding: 7px 10px; border-bottom: 1px solid #ede8dc; text-align: center; }
  table.games-tbl tr:last-child td { border-bottom: none; }
  .game-row.win  { background: var(--win-bg); }
  .game-row.loss { background: var(--loss-bg); }
  .game-row.draw { background: var(--draw-bg); }
  .bd-score  { font-size: 16px; font-weight: 900; color: var(--primary); }
  .opp-score { font-size: 16px; color: var(--muted); }
  .result-badge { display: inline-block; padding: 2px 8px; border-radius: 4px;
                   font-size: 12px; font-weight: 700; }
  .result-badge.win  { background: var(--win-cl);  color: #fff; }
  .result-badge.loss { background: var(--loss-cl); color: #fff; }
  .result-badge.draw { background: var(--draw-cl); color: #fff; }
  /* stats table */
  .tbl-wrap { overflow-x: auto; background: var(--card-bg); border: 1px solid var(--border);
               border-radius: 10px; overflow: hidden; margin-bottom: 28px; }
  table.stats-tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.stats-tbl th { background: var(--primary); color: #fff; padding: 7px 9px;
                         text-align: center; white-space: nowrap; }
  table.stats-tbl td { padding: 6px 9px; border-bottom: 1px solid #ede8dc; text-align: center; }
  table.stats-tbl tr:last-child td { border-bottom: none; }
  .name-col { text-align: left !important; font-weight: 700; }
  .hit-col  { font-weight: 700; }
  .rate-col { font-weight: 700; color: var(--primary); }
  .ip-col   { white-space: nowrap; }
  .unqual td { color: var(--muted); }
  .unqual .name-col { color: var(--text); font-weight: 600; }
  .section-divider td { font-size: 11px; font-weight: 700; color: var(--muted);
                          background: #f0ece0 !important; padding: 5px 9px !important; }
  .qual-badge { font-size: 9px; font-weight: 700; background: var(--gold); color: #fff;
                 border-radius: 3px; padding: 1px 4px; margin-left: 4px; vertical-align: middle; }
  .no-data { color: var(--muted); padding: 24px; text-align: center; font-style: italic; }
  .current-season-link { background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 12px; padding: 24px; text-align: center; margin: 24px 0; }
  .current-season-link a { color: var(--primary); font-weight: 700; font-size: 16px; }
  @media (max-width:600px) {
    .hero { padding: 24px 16px 20px; } .main { padding: 20px 16px 40px; }
  }
</style>
</head>

<div class="tc-stats">
<div class="tc-stat"><div class="tc-val">${tb.r}</div><div class="tc-lbl">得点</div></div>
<div class="tc-stat"><div class="tc-val">${tb.h}</div><div class="tc-lbl">安打</div></div>
<div class="tc-stat"><div class="tc-val">${tb.hr}</div><div class="tc-lbl">本塁打</div></div>
<div class="tc-stat"><div class="tc-val">${tb.rbi}</div><div class="tc-lbl">打点</div></div>
<div class="tc-stat"><div class="tc-val">${tb.sb}</div><div class="tc-lbl">盗塁</div></div>
<div class="tc-stat"><div class="tc-val">${tb.bb}</div><div class="tc-lbl">四死球</div></div>
<div class="tc-stat"><div class="tc-val">${tb.so}</div><div class="tc-lbl">三振</div></div>
<div class="tc-stat"><div class="tc-rate">${fmtAvg(tb.avg)}</div><div class="tc-lbl">打率</div></div>
<div class="tc-stat"><div class="tc-rate">${fmtAvg(tb.obp)}</div><div class="tc-lbl">出塁率</div></div>
</div></div>`;
  }
  if (tp.ip > 0) {
    html += `<div class="team-card">
<div class="tc-head">⚾ 投手成績</div>
<div class="tc-stats">
<div class="tc-stat"><div class="tc-val">${w}</div><div class="tc-lbl">勝利</div></div>
<div class="tc-stat"><div class="tc-val">${l}</div><div class="tc-lbl">敗北</div></div>
<div class="tc-stat"><div class="tc-val">${tp.sv}</div><div class="tc-lbl">セーブ</div></div>
<div class="tc-stat"><div class="tc-val">${ipStr(tp.ip)}</div><div class="tc-lbl">投球回</div></div>
<div class="tc-stat"><div class="tc-val">${tp.h}</div><div class="tc-lbl">被安打</div></div>
<div class="tc-stat"><div class="tc-val">${tp.bb}</div><div class="tc-lbl">四死球</div></div>
<div class="tc-stat"><div class="tc-val">${tp.k}</div><div class="tc-lbl">奪三振</div></div>
<div class="tc-stat"><div class="tc-val">${tp.r}</div><div class="tc-lbl">失点</div></div>
<div class="tc-stat"><div class="tc-rate">${fmtEra(tp.era)}</div><div class="tc-lbl">防御率</div></div>
</div></div>`;
  }

  // 試合結果
  if (s.games.length > 0) {
    html += '<div class="sec-hdr">📅 試合結果</div><div class="games-wrap"><table class="games-tbl"><thead><tr><th>日付</th><th>対戦相手</th><th colspan="3">スコア</th><th>結果</th></tr></thead><tbody>';
    for (const g of s.games) {
      const resCls = g.result === '勝' ? 'win' : g.result === '負' ? 'loss' : 'draw';
      const resLbl = g.result === '勝' ? '勝' : g.result === '負' ? '負' : '分';
      const parts = g.score.split('-');
      html += `<tr class="game-row ${resCls}"><td>${g.date}</td><td>${g.opp}</td><td class="bd-score">${parts[0]||''}</td><td>-</td><td class="opp-score">${parts[1]||''}</td><td><span class="result-badge ${resCls}">${resLbl}</span></td></tr>`;
    }
    html += '</tbody></table></div>';
  }

  // 打撃成績
  if (s.bat.length > 0) {
    html += '<div class="sec-hdr">🏏 打撃成績</div><div class="tbl-wrap"><table class="stats-tbl"><thead><tr><th>選手</th><th>試</th><th>打席</th><th>打数</th><th>得</th><th>安打</th><th>打点</th><th>盗塁</th><th>二塁</th><th>三塁</th><th>本塁</th><th>四死</th><th>三振</th><th>打率</th><th>出塁率</th></tr></thead><tbody>';
    let shownQual = false, shownUnqual = false;
    for (const b of s.bat) {
      if (b.q && !shownQual) {
        html += '<tr class="section-divider"><td colspan="15">◎ 規定打席到達</td></tr>';
        shownQual = true;
      }
      if (!b.q && !shownUnqual) {
        html += '<tr class="section-divider"><td colspan="15">○ 規定打席未満</td></tr>';
        shownUnqual = true;
      }
      const cls = b.q ? '' : ' class="unqual"';
      html += `<tr${cls}><td class="name-col">${b.name}</td><td>${b.g}</td><td>${b.pa}</td><td>${b.ab}</td><td>${b.r}</td><td class="hit-col">${b.h}</td><td>${b.rbi}</td><td>${b.sb}</td><td>${b.d||0}</td><td>${b.t||0}</td><td>${b.hr}</td><td>${b.bb}</td><td>${b.so}</td><td class="rate-col">${fmtAvg(b.avg)}</td><td class="rate-col">${fmtAvg(b.obp)}</td></tr>`;
    }
    html += '</tbody></table></div>';
  } else {
    html += '<div class="sec-hdr">🏏 打撃成績</div><div class="no-data">個人打撃成績データがありません</div>';
  }

  // 投手成績
  if (s.pit.length > 0) {
    html += '<div class="sec-hdr">⚾ 投手成績</div><div class="tbl-wrap"><table class="stats-tbl"><thead><tr><th>投手</th><th>試</th><th>勝</th><th>敗</th><th>S</th><th>投球回</th><th>打者</th><th>被安</th><th>四死</th><th>奪三</th><th>失点</th><th>自責</th><th>防御率</th></tr></thead><tbody>';
    for (const p of s.pit) {
      const qualBadge = p.q ? '<span class="qual-badge">規定</span>' : '';
      html += `<tr><td class="name-col">${p.name}${qualBadge}</td><td>${p.g}</td><td>${p.w}</td><td>${p.l}</td><td>${p.sv}</td><td class="ip-col">${ipStr(p.ip)}</td><td>${p.bf}</td><td>${p.h}</td><td>${p.bb}</td><td>${p.k}</td><td>${p.r}</td><td>${p.er}</td><td class="rate-col">${fmtEra(p.era)}</td></tr>`;
    }
    html += '</tbody></table></div>';
  } else {
    html += '<div class="sec-hdr">⚾ 投手成績</div><div class="no-data">個人投手成績データがありません</div>';
  }

  document.getElementById('main-area').innerHTML = html;
}

// 初期表示
showYear(2025);
</script>
</body>
</html>
