<html lang="ja">
<head>
<meta charset="UTF-8">

<title>バミューダドルフィンズ 全試合記録</title>
<style>
  :root {
    --primary: #1a3a5c;
    --accent:  #c8102e;
    --gold:    #d4a017;
    --bg:      #f5f0e8;
    --card-bg: #fffef9;
    --border:  #d4c8a8;
    --text:    #2c2416;
    --muted:   #7a6e5a;
    --win:     #1a7a3c;
    --loss:    #c8102e;
    --draw:    #6e5a1a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;
          background: var(--bg); color: var(--text); min-height: 100vh; }

  /* ── ヘッダー ── */
  header { background: var(--primary); color: white; box-shadow: 0 3px 8px rgba(0,0,0,.3); }
  .header-inner { max-width: 1200px; margin: 0 auto; padding: 16px 24px;
                   display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .site-logo { font-size: 24px; font-weight: 900; line-height: 1.1; }
  .site-logo span { color: var(--gold); }
  .site-subtitle { font-size: 11px; color: #a0b8d0; margin-top: 3px; }

  /* ── ナビ ── */
  nav { background: #122a42; padding: 0 24px; display: flex; gap: 4px; flex-wrap: wrap; }
  nav a { color: #a0b8d0; text-decoration: none; padding: 10px 14px; font-size: 13px;
           border-bottom: 3px solid transparent; transition: .2s; }
  nav a:hover, nav a.active { color: white; border-bottom-color: var(--gold); }

  /* ── メインコンテンツ ── */
  .container { max-width: 1200px; margin: 0 auto; padding: 24px; }

  /* ── フィルターバー ── */
  .filter-bar { background: var(--card-bg); border: 1px solid var(--border);
                 border-radius: 10px; padding: 16px 20px; margin-bottom: 20px; }
  .filter-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .filter-row:last-child { margin-bottom: 0; }
  .filter-label { font-size: 12px; color: var(--muted); font-weight: 600;
                   min-width: 60px; }
  .search-input { padding: 7px 12px; border: 1px solid var(--border); border-radius: 6px;
                   font-size: 14px; outline: none; background: white; flex: 1; min-width: 180px; }
  .search-input:focus { border-color: var(--primary); }
  .year-scroll { display: flex; gap: 5px; flex-wrap: wrap; }
  .yr-btn { padding: 5px 10px; border: 1px solid var(--border); border-radius: 4px;
             background: white; font-size: 12px; cursor: pointer; color: var(--muted);
             transition: .15s; }
  .yr-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }
  .yr-btn.active { background: var(--primary); color: white; border-color: var(--primary); font-weight: 700; }
  .yr-btn.decade { background: #e8e0d0; font-weight: 600; }
  .yr-btn.decade.active { background: var(--gold); color: #2c2416; border-color: var(--gold); }
  .result-btns { display: flex; gap: 6px; }
  .res-btn { padding: 5px 14px; border-radius: 20px; border: 2px solid; font-size: 13px;
              font-weight: 700; cursor: pointer; background: white; transition: .15s; }
  .res-btn.win-btn  { color: var(--win);  border-color: var(--win); }
  .res-btn.loss-btn { color: var(--loss); border-color: var(--loss); }
  .res-btn.draw-btn { color: var(--draw); border-color: var(--draw); }
  .res-btn.all-btn  { color: var(--primary); border-color: var(--primary); }
  .res-btn.active { color: white; }
  .res-btn.win-btn.active  { background: var(--win);  }
  .res-btn.loss-btn.active { background: var(--loss); }
  .res-btn.draw-btn.active { background: var(--draw); }
  .res-btn.all-btn.active  { background: var(--primary); }

  /* ── 統計バー ── */
  .stats-bar { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 16px;
                font-size: 13px; color: var(--muted); align-items: center; }
  .stats-bar strong { color: var(--text); font-size: 15px; }
  .stats-win  { color: var(--win); font-weight: 700; }
  .stats-loss { color: var(--loss); font-weight: 700; }
  .stats-draw { color: var(--draw); font-weight: 700; }

  /* ── テーブル ── */
  .table-wrap { overflow-x: auto; border-radius: 10px;
                 box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  table { width: 100%; border-collapse: collapse; background: var(--card-bg);
           font-size: 14px; }
  thead { background: var(--primary); color: white; }
  thead th { padding: 10px 12px; text-align: left; font-weight: 600;
              font-size: 12px; white-space: nowrap; }
  tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; }
  tbody tr:hover { background: #f0ece0; }
  tbody tr.hidden { display: none; }
  td { padding: 9px 12px; white-space: nowrap; }
  .td-no    { color: var(--muted); font-size: 12px; width: 50px; }
  .td-date  { width: 90px; font-variant-numeric: tabular-nums; }
  .td-opp   { font-weight: 600; max-width: 200px; overflow: hidden;
               text-overflow: ellipsis; }
  .td-score { font-variant-numeric: tabular-nums; font-family: monospace;
               font-size: 15px; font-weight: 700; width: 80px; text-align: center; }
  .score-win  { color: var(--win); }
  .score-loss { color: var(--loss); }
  .score-draw { color: var(--draw); }
  .td-result { width: 60px; text-align: center; }
  .td-times  { width: 90px; }

  /* バッジ */
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px;
            font-size: 12px; font-weight: 700; }
  .badge.win   { background: #d4edda; color: var(--win); }
  .badge.loss  { background: #fce8e8; color: var(--loss); }
  .badge.draw  { background: #fef9e0; color: var(--draw); }
  .badge.other { background: #e8e8e8; color: var(--muted); }

  /* Times リンク */
  .times-link { display: inline-flex; align-items: center; gap: 4px;
                 color: var(--primary); text-decoration: none; font-size: 12px;
                 padding: 3px 8px; border: 1px solid var(--border);
                 border-radius: 4px; background: white; transition: .15s; }
  .times-link:hover { background: var(--primary); color: white; border-color: var(--primary); }
  .times-icon { font-size: 13px; }
  .no-times { color: var(--border); font-size: 12px; }

  /* フッター */
  footer { text-align: center; padding: 20px; color: var(--muted); font-size: 12px;
            margin-top: 40px; }
</style>
</head>

const ALL_YEARS = [2026, 2025, 2024, 2023, 2022, 2021, 2020, 2019, 2018, 2017, 2016, 2015, 2014, 2013, 2012, 2011, 2010, 2009, 2008, 2007, 2006, 2005, 2004, 2003, 2002, 2001, 2000, 1999, 1998, 1997, 1996, 1995, 1994, 1993, 1992, 1991, 1990, 1989, 1988, 1987, 1986, 1985, 1984, 1983, 1982, 1981, 1980, 1979, 1978, 1977, 1976];

let currentYear   = 'all';
let currentResult = 'all';

// ── 年度ボタン生成 ─────────────────────────────────────────────────────────────
function buildYearButtons() {
  const container = document.getElementById('yearBtns');
  // 「全て」ボタン
  const allBtn = document.createElement('button');
  allBtn.className = 'yr-btn active';
  allBtn.textContent = '全て';
  allBtn.onclick = () => setYear('all');
  allBtn.dataset.year = 'all';
  container.appendChild(allBtn);

  // 年代グループ
  const decades = {};
  ALL_YEARS.forEach(y => {
    const d = Math.floor(y / 10) * 10;
    (decades[d] = decades[d] || []).push(y);
  });
  Object.keys(decades).sort((a,b)=>b-a).forEach(d => {
    const dBtn = document.createElement('button');
    dBtn.className = 'yr-btn decade';
    dBtn.textContent = d + 's';
    dBtn.onclick = () => setYear('decade_' + d);
    dBtn.dataset.year = 'decade_' + d;
    container.appendChild(dBtn);
  });
  ALL_YEARS.forEach(y => {
    const btn = document.createElement('button');
    btn.className = 'yr-btn';
    btn.textContent = y;
    btn.onclick = () => setYear(y);
    btn.dataset.year = String(y);
    container.appendChild(btn);
  });
}

// ── テーブル構築 ──────────────────────────────────────────────────────────────
function buildTable() {
  const tbody = document.getElementById('gamesTbody');
  tbody.innerHTML = '';
  [...GAMES].reverse().forEach(g => {
    const tr = document.createElement('tr');
    tr.dataset.year   = g.year;
    tr.dataset.result = g.result;
    tr.dataset.opp    = g.opp;
    tr.dataset.decade = Math.floor(g.year / 10) * 10;

    const scoreCls = g.result === '勝' ? 'score-win' : g.result === '負' ? 'score-loss' : 'score-draw';
    const badgeCls = g.result === '勝' ? 'win' : g.result === '負' ? 'loss' : g.result === '分' ? 'draw' : 'other';

    const timesCell = g.pdf
      ? `<a class="times-link" href="${g.pdf}" target="_blank">
           <span class="times-icon">📰</span>${g.issue}
         </a>`
      : '<span class="no-times">—</span>';

    const noText = g.gno > 0 ? g.gno : '';

    tr.innerHTML = `
      <td class="td-no">${noText}</td>
      <td class="td-date">${g.date}</td>
      <td class="td-opp">${g.opp}</td>
      <td class="td-score ${scoreCls}">${g.score}</td>
      <td class="td-result"><span class="badge ${badgeCls}">${g.result}</span></td>
      <td class="td-times">${timesCell}</td>
    `;
    tbody.appendChild(tr);
  });
}

// ── フィルター適用 ────────────────────────────────────────────────────────────
function applyFilter() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const rows = document.querySelectorAll('#gamesTbody tr');
  let total = 0, win = 0, loss = 0, draw = 0;

  rows.forEach(tr => {
    const yr     = tr.dataset.year;
    const res    = tr.dataset.result;
    const opp    = tr.dataset.opp.toLowerCase();
    const decade = tr.dataset.decade;

    let show = true;
    // 年度フィルター
    if (currentYear !== 'all') {
      if (currentYear.startsWith('decade_')) {
        const d = currentYear.replace('decade_', '');
        if (decade !== d) show = false;
      } else {
        if (yr !== String(currentYear)) show = false;
      }
    }
    // 勝敗フィルター
    if (currentResult !== 'all' && res !== currentResult) show = false;
    // 検索
    if (q && !opp.includes(q)) show = false;

    tr.classList.toggle('hidden', !show);
    if (show) {
      total++;
      if (res === '勝') win++;
      else if (res === '負') loss++;
      else if (res === '分') draw++;
    }
  });

  document.getElementById('countTotal').textContent = total;
  document.getElementById('countWin').textContent   = win + '勝';
  document.getElementById('countLoss').textContent  = loss + '敗';
  document.getElementById('countDraw').textContent  = draw + '分';
  const reg = win + loss;
  document.getElementById('rateTxt').textContent = reg > 0
    ? `勝率 ${(win/reg*100).toFixed(1)}%` : '';
}

function setYear(y) {
  currentYear = y;
  document.querySelectorAll('.yr-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.year === String(y));
  });
  applyFilter();
}

function setResult(r) {
  currentResult = r;
  document.querySelectorAll('.res-btn').forEach(b => b.classList.remove('active'));
  const map = {'all':'all-btn','勝':'win-btn','負':'loss-btn','分':'draw-btn'};
  document.querySelector('.' + (map[r]||'all-btn')).classList.add('active');
  applyFilter();
}

// ── 初期化 ────────────────────────────────────────────────────────────────────
buildYearButtons();
buildTable();
applyFilter();
</script>
