<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>年度別タイトル | バミューダドルフィンズ</title>
<style>
  :root {
    --primary:#1a3a5c; --gold:#d4a017; --bg:#f5f0e8;
    --card-bg:#fffef9; --border:#d4c8a8; --text:#2c2416; --muted:#7a6e5a;
    --pit-hdr:#1a4a2c; --rookie-hdr:#5c2a1a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;
        background:var(--bg);color:var(--text)}

  /* Header */
  header{background:var(--primary);color:white;box-shadow:0 3px 8px rgba(0,0,0,.3)}
  .header-inner{max-width:1400px;margin:0 auto;padding:12px 24px;
                 display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .site-logo{font-size:20px;font-weight:900;white-space:nowrap}
  .site-logo span{color:var(--gold)}
  .nav-links{margin-left:auto;display:flex;gap:8px}
  .nav-links a{color:#a0b8d0;text-decoration:none;font-size:13px;
                padding:4px 10px;border-radius:4px;white-space:nowrap}
  .nav-links a:hover{background:rgba(255,255,255,.1);color:white}
  .nav-links a.active{color:var(--gold);font-weight:700}

  /* Mode tabs */
  .mode-bar{background:#122a42;padding:0 24px;display:flex;gap:0}
  .mode-tab{padding:10px 22px;border:none;background:transparent;
             color:#6888a8;font-size:14px;font-weight:700;cursor:pointer;
             border-bottom:3px solid transparent;transition:all .2s}
  .mode-tab:hover{color:#a0c0e0}
  .mode-tab.active{color:var(--gold);border-bottom-color:var(--gold)}

  /* Layout */
  .layout{display:flex;max-width:1400px;margin:0 auto;min-height:calc(100vh - 100px)}

  /* Sidebar */
  aside{width:130px;flex-shrink:0;background:#e0d8c8;
         border-right:1px solid var(--border);
         overflow-y:auto;height:calc(100vh - 100px);position:sticky;top:0}
  .decade-head{font-size:10px;font-weight:700;color:white;
                background:var(--primary);padding:5px 10px;letter-spacing:.05em}
  .side-btn{display:block;width:100%;padding:6px 10px;border:none;
             background:transparent;color:var(--text);font-size:12px;
             font-weight:600;text-align:left;cursor:pointer;
             border-left:3px solid transparent;transition:background .12s;
             white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .side-btn:hover{background:#d0c8b8}
  .side-btn.active{background:var(--primary);color:white;border-left-color:var(--gold)}
  .sec-head{font-size:10px;font-weight:700;color:var(--muted);
             padding:8px 10px 3px;letter-spacing:.06em;
             border-top:1px solid var(--border);margin-top:4px}
  .sec-head:first-child{border-top:none;margin-top:0}

  /* Main */
  main{flex:1;padding:24px;overflow-y:auto}

  /* Welcome */
  #welcome{text-align:center;padding:80px 20px;color:var(--muted)}
  #welcome h2{font-size:22px;color:var(--primary);margin-bottom:12px}

  /* ═══ YEAR VIEW ═══ */
  #year-view{display:none}
  .year-hero{display:flex;align-items:center;gap:20px;margin-bottom:20px;
              flex-wrap:wrap;border-bottom:2px solid var(--primary);padding-bottom:14px}
  .year-big{font-size:52px;font-weight:900;color:var(--primary);line-height:1}
  .year-games{font-size:14px;color:var(--muted)}
  .year-games strong{color:var(--primary);font-size:20px}

  /* MVP card */
  .honor-row{display:flex;gap:14px;margin-bottom:20px;flex-wrap:wrap}
  .mvp-card{background:linear-gradient(135deg,#1a3a5c 0%,#2a5a8c 100%);
             border-radius:10px;padding:14px 20px;flex:1;min-width:220px;
             display:flex;align-items:center;gap:14px;
             box-shadow:0 3px 10px rgba(26,58,92,.22)}
  .rookie-card{background:linear-gradient(135deg,#5c2a1a 0%,#8c4a2a 100%);
                border-radius:10px;padding:14px 20px;flex:1;min-width:220px;
                display:flex;align-items:center;gap:14px;
                box-shadow:0 3px 10px rgba(92,42,26,.22)}
  .honor-icon{font-size:30px;line-height:1}
  .honor-body{flex:1;min-width:0}
  .honor-label{font-size:10px;font-weight:700;letter-spacing:.12em;
                color:rgba(255,255,255,.6);text-transform:uppercase;margin-bottom:3px}
  .honor-name{font-size:19px;font-weight:900;color:var(--gold)}
  .honor-name a{color:var(--gold);text-decoration:none;border-bottom:1px dotted rgba(212,160,23,.4)}
  .honor-name a:hover{color:#f0c040}
  .honor-name.rookie-clr{color:#f0c080}
  .honor-name.rookie-clr a{color:#f0c080;border-bottom-color:rgba(240,192,128,.4)}
  .honor-empty{font-size:13px;color:rgba(255,255,255,.35);font-style:italic}

  /* Team stats */
  .team-stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
  @media(max-width:780px){.team-stats-grid{grid-template-columns:1fr}}
  .stat-card{background:var(--card-bg);border:1px solid var(--border);border-radius:10px;overflow:hidden}
  .stat-card-hdr{padding:8px 14px;font-size:12px;font-weight:700;color:white;
                  background:var(--primary);display:flex;align-items:center;gap:6px}
  .stat-card-hdr.pit{background:var(--pit-hdr)}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));
              gap:0;padding:0}
  .stat-item{padding:8px 10px;border-right:1px solid #ede5d4;border-bottom:1px solid #ede5d4;
              text-align:center}
  .stat-item:last-child,.stat-item:nth-child(4n){border-right:none}
  .stat-lbl{font-size:10px;color:var(--muted);font-weight:600;margin-bottom:2px}
  .stat-val{font-size:15px;font-weight:900;color:var(--primary)}
  .stat-val.rate{font-size:13px}

  /* Title tables */
  .sections-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-bottom:20px}
  @media(max-width:780px){.sections-grid{grid-template-columns:1fr}}
  .year-nav{display:flex;justify-content:space-between;margin-top:24px}
  .nav-btn{padding:8px 18px;background:var(--primary);color:white;border:none;
            border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s}
  .nav-btn:hover{background:#2a5a8c}
  .nav-btn:disabled{background:#c0b8a8;cursor:default}

  /* Other titles */
  .other-section{background:var(--card-bg);border:1px solid var(--border);
                  border-radius:10px;overflow:hidden;margin-bottom:20px}
  .other-hdr{padding:10px 16px;font-size:13px;font-weight:700;color:white;
              background:#4a3a1a;display:flex;align-items:center;gap:6px}
  .other-list{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px}
  .other-item{background:#f0e8d8;border-radius:8px;padding:6px 12px;
               display:flex;align-items:center;gap:8px}
  .other-award{font-size:11px;font-weight:700;color:#4a3a1a;white-space:nowrap}
  .other-names{font-size:13px;font-weight:600}

  /* ═══ TITLE VIEW ═══ */
  #title-view{display:none}
  .title-hero{display:flex;align-items:baseline;gap:16px;margin-bottom:20px;
               border-bottom:2px solid var(--primary);padding-bottom:14px;flex-wrap:wrap}
  .title-big{font-size:32px;font-weight:900;color:var(--primary)}
  .title-meta{font-size:13px;color:var(--muted)}
  .winner-counts{background:var(--card-bg);border:1px solid var(--border);border-radius:10px;
                  padding:14px 18px;margin-bottom:20px}
  .wc-title{font-size:11px;font-weight:700;color:var(--muted);
             letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}
  .wc-list{display:flex;flex-wrap:wrap;gap:8px}
  .wc-item{display:flex;align-items:center;gap:7px;background:#f0e8d8;
            border-radius:20px;padding:5px 12px;cursor:pointer;transition:background .15s}
  .wc-item:hover{background:#e0d0b8}
  .wc-name{font-size:13px;font-weight:700}
  .wc-count{background:var(--primary);color:white;font-size:11px;font-weight:700;
             padding:1px 7px;border-radius:10px}
  .hist-table-wrap{background:var(--card-bg);border:1px solid var(--border);border-radius:10px;overflow:hidden}
  .hist-table-head{background:var(--primary);color:white;padding:10px 16px;
                    font-size:13px;font-weight:700}
  .hist-table-head.pit{background:var(--pit-hdr)}

  /* Shared table */
  .title-section{background:var(--card-bg);border:1px solid var(--border);border-radius:10px;overflow:hidden}
  .ts-header{padding:10px 16px;font-size:13px;font-weight:700;color:white;background:var(--primary)}
  .ts-header.pit{background:var(--pit-hdr)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{background:rgba(0,0,0,.04);padding:7px 14px;text-align:left;
            font-size:11px;font-weight:700;color:var(--muted);
            border-bottom:1px solid var(--border)}
  thead th.right{text-align:right}
  tbody tr{border-bottom:1px solid #ede5d4;transition:background .1s}
  tbody tr:last-child{border-bottom:none}
  tbody tr:hover{background:#f4eee0}
  td{padding:8px 14px;vertical-align:middle}
  td.yr{font-weight:700;color:var(--primary);width:70px}
  td.val{text-align:right;font-weight:700;color:var(--primary);width:70px}
  td.nm{font-weight:600}
  .na{color:var(--muted);font-style:italic;font-size:12px;font-weight:400}
  .player-link{color:var(--text);text-decoration:none;border-bottom:1px dotted var(--muted)}
  .player-link:hover{color:var(--primary);border-bottom-color:var(--primary)}
  .multi{display:flex;flex-wrap:wrap;gap:3px}

  @media(max-width:600px){
    aside{width:90px}
    .side-btn{font-size:11px;padding:5px 7px}
    main{padding:12px}
    .year-big{font-size:36px}
    .title-big{font-size:24px}
  }
</style>
</head>

const BAT_LABELS = ["首位打者", "最多本塁打", "打点王", "盗塁王", "最多安打", "出塁王", "最多打席", "最多得点", "最多単打", "最多二塁打", "最多三塁打", "最多四死球", "最多三振", "最多犠打", "最多残塁"];
const PIT_LABELS = ["最多勝利", "最優秀防御率", "最多奪三振"];

let mode = 'year';
let currentYearIdx  = -1;
let currentTitleKey = '';

/* ── mode switch ── */
function setMode(m) {
  mode = m;
  document.getElementById('tab-year').classList.toggle('active',  m==='year');
  document.getElementById('tab-title').classList.toggle('active', m==='title');
  buildSidebar();
  document.getElementById('year-view').style.display  = 'none';
  document.getElementById('title-view').style.display = 'none';
  document.getElementById('welcome').style.display    = 'block';
}

/* ── sidebar ── */
function buildSidebar() {
  const aside = document.getElementById('sidebar');
  let html = '';
  if (mode === 'year') {
    let curDecade = -1;
    YEARS.forEach((y, i) => {
      const decade = Math.floor(y.year / 10) * 10;
      if (decade !== curDecade) { curDecade = decade;
        html += `<div class="decade-head">${decade}年代</div>`; }
      const act = (i === currentYearIdx) ? ' active' : '';
      html += `<button class="side-btn${act}" id="ybtn-${i}" onclick="showYear(${i})">${y.year}</button>`;
    });
  } else {
    html += '<div class="sec-head">最高栄誉</div>';
    html += sideBtn('MVP', '👑 MVP');
    html += '<div class="sec-head">打撃タイトル</div>';
    BAT_LABELS.forEach(l => html += sideBtn(l, '🏏 ' + l));
    html += '<div class="sec-head">投手タイトル</div>';
    PIT_LABELS.forEach(l => html += sideBtn(l, '⚾ ' + l));
  }
  aside.innerHTML = html;
}

function sideBtn(key, label) {
  const act = (key === currentTitleKey) ? ' active' : '';
  return `<button class="side-btn${act}" onclick="showTitle('${key}')">${label}</button>`;
}

/* ── helpers ── */
function playerLink(name) {
  const id = NAME_ID[name];
  return id
    ? `<a class="player-link" href="players.html#player=${id}">${name}</a>`
    : `<span>${name}</span>`;
}
function renderNames(data) {
  if (!data) return '<span class="na">—</span>';
  if (data.na) return '<span class="na">—</span>';
  if (!data.players?.length) return '<span class="na">—</span>';
  const links = data.players.map(playerLink);
  return links.length === 1 ? links[0]
    : `<span class="multi">${links.join('<span style="color:var(--muted);margin:0 2px">・</span>')}</span>`;
}
function renderValue(data) {
  return (data && !data.na && data.value) ? data.value : '';
}

/* ── Honor card HTML ── */
function honorCard(cls, icon, labelText, data, nameClass) {
  if (data && !data.na && data.players?.length) {
    const names = data.players.map(playerLink)
      .join('<span style="color:rgba(255,255,255,.4);margin:0 6px">・</span>');
    return `<div class="${cls}">
      <div class="honor-icon">${icon}</div>
      <div class="honor-body">
        <div class="honor-label">${labelText}</div>
        <div class="honor-name ${nameClass}">${names}</div>
      </div></div>`;
  }
  return `<div class="${cls}">
    <div class="honor-icon">${icon}</div>
    <div class="honor-body">
      <div class="honor-label">${labelText}</div>
      <div class="honor-empty">該当なし</div>
    </div></div>`;
}

        <div class="stat-item"><div class="stat-lbl">打席</div><div class="stat-val">${tb.pa}</div></div>
        <div class="stat-item"><div class="stat-lbl">打数</div><div class="stat-val">${tb.ab}</div></div>
        <div class="stat-item"><div class="stat-lbl">安打</div><div class="stat-val">${tb.h}</div></div>
        <div class="stat-item"><div class="stat-lbl">本塁打</div><div class="stat-val">${tb.hr}</div></div>
        <div class="stat-item"><div class="stat-lbl">打点</div><div class="stat-val">${tb.rbi}</div></div>
        <div class="stat-item"><div class="stat-lbl">得点</div><div class="stat-val">${tb.r}</div></div>
        <div class="stat-item"><div class="stat-lbl">盗塁</div><div class="stat-val">${tb.sb}</div></div>
        <div class="stat-item"><div class="stat-lbl">四死球</div><div class="stat-val">${tb.bb}</div></div>
        <div class="stat-item"><div class="stat-lbl">三振</div><div class="stat-val">${tb.so}</div></div>
        <div class="stat-item"><div class="stat-lbl">打率</div><div class="stat-val rate">${tb.avg||'—'}</div></div>
        <div class="stat-item"><div class="stat-lbl">出塁率</div><div class="stat-val rate">${tb.obp||'—'}</div></div>
      </div>
    </div>` : '';

  const pitHtml = tp ? `
    <div class="stat-card">
      <div class="stat-card-hdr pit">⚾ チーム投手成績</div>
      <div class="stat-grid">
        <div class="stat-item"><div class="stat-lbl">勝利</div><div class="stat-val">${tp.w}</div></div>
        <div class="stat-item"><div class="stat-lbl">敗戦</div><div class="stat-val">${tp.l}</div></div>
        <div class="stat-item"><div class="stat-lbl">セーブ</div><div class="stat-val">${tp.sv}</div></div>
        <div class="stat-item"><div class="stat-lbl">投球回</div><div class="stat-val">${tp.ip}</div></div>
        <div class="stat-item"><div class="stat-lbl">奪三振</div><div class="stat-val">${tp.k}</div></div>
        <div class="stat-item"><div class="stat-lbl">被安打</div><div class="stat-val">${tp.ha}</div></div>
        <div class="stat-item"><div class="stat-lbl">四死球</div><div class="stat-val">${tp.bb}</div></div>
        <div class="stat-item"><div class="stat-lbl">失点</div><div class="stat-val">${tp.r}</div></div>
        <div class="stat-item"><div class="stat-lbl">自責点</div><div class="stat-val">${tp.er}</div></div>
        <div class="stat-item"><div class="stat-lbl">防御率</div><div class="stat-val rate">${tp.era||'—'}</div></div>
      </div>
    </div>` : '';

  return `<div class="team-stats-grid">${batHtml}${pitHtml}</div>`;
}

/* ── Other titles HTML ── */
function otherTitlesHtml(y) {
  const list = y.other_titles;
  if (!list || !list.length) return '';
  const items = list.map(item => {
    const names = item.players.map(playerLink)
      .join('<span style="color:var(--muted);margin:0 4px">・</span>');
    return `<div class="other-item">
      <span class="other-award">${item.award}</span>
      <span class="other-names">${names}</span>
    </div>`;
  }).join('');
  return `<div class="other-section">
    <div class="other-hdr">🏅 その他表彰</div>
    <div class="other-list">${items}</div>
  </div>`;
}

/* ══════════════════════════════
   YEAR VIEW
══════════════════════════════ */
function showYear(idx) {
  currentYearIdx = idx;
  buildSidebar();
  const y = YEARS[idx];

  // Honor row: MVP + 新人王
  const mvpHtml    = honorCard('mvp-card',    '👑', 'Most Valuable Player', y.mvp, '');
  const rookieHtml = honorCard('rookie-card', '🌟', '新人王 Rookie of the Year', y.rookie, 'rookie-clr');

  // Team stats
  const teamHtml = teamStatsHtml(y);

  // Batting table
  const batRows = y.batting.map(item => `<tr>
    <td class="yr" style="width:130px;color:var(--muted);font-size:12px">${item.label}</td>
    <td class="nm">${renderNames(item.data)}</td>
    <td class="val">${renderValue(item.data)}</td></tr>`).join('');

  // Pitching table
  const pitRows = y.pitching.map(item => `<tr>
    <td class="yr" style="width:130px;color:var(--muted);font-size:12px">${item.label}</td>
    <td class="nm">${renderNames(item.data)}</td>
    <td class="val">${renderValue(item.data)}</td></tr>`).join('');

  // Other titles
  const otherHtml = otherTitlesHtml(y);

  const pd = idx === 0 ? 'disabled' : '';
  const nd = idx === YEARS.length-1 ? 'disabled' : '';

  document.getElementById('welcome').style.display   = 'none';
  document.getElementById('title-view').style.display = 'none';
  const yv = document.getElementById('year-view');
  yv.style.display = 'block';
  yv.innerHTML = `
    <div class="year-hero">
      <div class="year-big">${y.year}</div>
      <div class="year-games">シーズン試合数<br><strong>${y.games}</strong> 試合</div>
    </div>
    <div class="honor-row">${mvpHtml}${rookieHtml}</div>
    ${teamHtml}
    <div class="sections-grid">
      <div class="title-section">
        <div class="ts-header">🏏 打撃タイトル</div>
        <table><thead><tr><th>タイトル</th><th>選手名</th><th class="right">記録</th></tr></thead>
        <tbody>${batRows}</tbody></table></div>
      <div class="title-section">
        <div class="ts-header pit">⚾ 投手タイトル</div>
        <table><thead><tr><th>タイトル</th><th>選手名</th><th class="right">記録</th></tr></thead>
        <tbody>${pitRows || '<tr><td colspan="3" style="padding:14px;text-align:center;color:var(--muted)">記録なし</td></tr>'}</tbody></table></div>
    </div>
    ${otherHtml}
    <div class="year-nav">
      <button class="nav-btn" ${pd} onclick="showYear(${idx-1})">← ${idx>0?YEARS[idx-1].year:''}</button>
      <button class="nav-btn" ${nd} onclick="showYear(${idx+1})">${idx<YEARS.length-1?YEARS[idx+1].year:''} →</button>
    </div>`;

  const btn = document.getElementById('ybtn-' + idx);
  if (btn) btn.scrollIntoView({block:'nearest'});
}

/* ══════════════════════════════
   TITLE VIEW
══════════════════════════════ */
function showTitle(key) {
  currentTitleKey = key;
  buildSidebar();

  const entries = TITLE_IDX[key] || [];
  const isPit   = PIT_LABELS.includes(key);

  const winCount = {};
  entries.forEach(e => e.players.forEach(p => { winCount[p] = (winCount[p]||0) + 1; }));
  const sorted = Object.entries(winCount).sort((a,b)=>b[1]-a[1]);

  const wcItems = sorted.map(([name, cnt]) =>
    `<div class="wc-item" onclick="filterByPlayer('${name.replace(/'/g,"\'")}')">
      ${playerLink(name)}
      <span class="wc-count">${cnt}回</span>
    </div>`).join('');

  const histRows = entries.map(e => `<tr>
    <td class="yr">${e.year}年</td>
    <td class="nm">${e.players.map(playerLink).join('<span style="color:var(--muted);margin:0 3px">・</span>')}</td>
    <td class="val">${e.value || ''}</td>
  </tr>`).join('');

  document.getElementById('welcome').style.display    = 'none';
  document.getElementById('year-view').style.display  = 'none';
  const tv = document.getElementById('title-view');
  tv.style.display = 'block';
  tv.innerHTML = `
    <div class="title-hero">
      <div class="title-big">${key}</div>
      <div class="title-meta">${entries.length} 年度のデータ</div>
    </div>
    <div class="winner-counts">
      <div class="wc-title">受賞回数ランキング（名前をクリックで絞り込み）</div>
      <div class="wc-list" id="wc-list">${wcItems}</div>
    </div>
    <div class="hist-table-wrap">
      <div class="hist-table-head${isPit?' pit':''}">年度別受賞者一覧</div>
      <table>
        <thead><tr>
          <th>年度</th><th>選手名</th>
          <th class="right">${key==='MVP'?'':key==='最優秀防御率'?'防御率':key==='最多勝利'?'勝利数':key==='最多奪三振'?'奪三振':'記録'}</th>
        </tr></thead>
        <tbody id="hist-tbody">${histRows}</tbody>
      </table>
    </div>`;
}

let filterPlayer = null;
function filterByPlayer(name) {
  filterPlayer = (filterPlayer === name) ? null : name;
  document.querySelectorAll('#wc-list .wc-item').forEach(el => {
    const elName = el.querySelector('.player-link, span')?.textContent;
    el.style.background = (filterPlayer && elName === filterPlayer) ? '#c8d8e8' : '';
  });
  document.querySelectorAll('#hist-tbody tr').forEach(tr => {
    const names = tr.querySelector('td.nm')?.textContent || '';
    tr.style.display = (!filterPlayer || names.includes(filterPlayer)) ? '' : 'none';
  });
}

/* Hash navigation */
function handleHash() {
  const my = window.location.hash.match(/^#year=(\d+)$/);
  if (my) {
    const idx = YEARS.findIndex(y => y.year === parseInt(my[1]));
    if (idx >= 0) { setMode('year'); buildSidebar(); showYear(idx); }
    return;
  }
  const mt = window.location.hash.match(/^#title=(.+)$/);
  if (mt) {
    const key = decodeURIComponent(mt[1]);
    if (TITLE_IDX[key]) { setMode('title'); buildSidebar(); showTitle(key); }
  }
}
window.addEventListener('hashchange', handleHash);

buildSidebar();
handleHash();
if (currentYearIdx < 0 && !currentTitleKey) {
  setMode('year');
  buildSidebar();
  showYear(YEARS.length - 1);
}
</script>
</body>
</html>
