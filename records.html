<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>通算記録 | バミューダドルフィンズ</title>
<style>
  :root {
    --primary: #1a3a5c;
    --accent: #c8102e;
    --gold: #d4a017;
    --silver: #8a9aaa;
    --bronze: #a0622a;
    --bg: #f5f0e8;
    --card-bg: #fffef9;
    --border: #d4c8a8;
    --text: #2c2416;
    --muted: #7a6e5a;
    --win: #1a7a3c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif; background: var(--bg); color: var(--text); }

  /* Header */
  header { background: var(--primary); color: white; box-shadow: 0 3px 8px rgba(0,0,0,.3); }
  .header-inner { max-width: 1400px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .site-logo { font-size: 22px; font-weight: 900; }
  .site-logo span { color: var(--gold); }
  .nav-links { margin-left: auto; display: flex; gap: 12px; }
  .nav-links a { color: #a0b8d0; text-decoration: none; font-size: 13px; padding: 4px 10px; border-radius: 4px; transition: background .2s; }
  .nav-links a:hover { background: rgba(255,255,255,.1); color: white; }
  .nav-links a.active { color: var(--gold); font-weight: 600; }

  /* Category tabs */
  .cat-bar { background: #122a42; padding: 0 24px; display: flex; gap: 0; overflow-x: auto; }
  .cat-tab { padding: 10px 18px; border: none; background: transparent; color: #6888a8; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; border-bottom: 3px solid transparent; transition: all .2s; }
  .cat-tab:hover { color: #a0c0e0; }
  .cat-tab.active { color: var(--gold); border-bottom-color: var(--gold); }

  /* Main */
  .main { max-width: 1400px; margin: 0 auto; padding: 24px; }

  /* Category section */
  .cat-section { display: none; }
  .cat-section.active { display: block; }
  .cat-title { font-size: 20px; font-weight: 900; color: var(--primary); margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid var(--primary); }
  .cat-title span { font-size: 13px; font-weight: 400; color: var(--muted); margin-left: 12px; }

  /* Ranking grid */
  .rank-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; }

  /* Ranking card */
  .rank-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .rank-card-header { background: var(--primary); color: white; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; }
  .rank-card-title { font-size: 14px; font-weight: 700; }
  .rank-card-note { font-size: 11px; color: #a0b8d0; }
  .rank-table { width: 100%; border-collapse: collapse; }
  .rank-table td { padding: 7px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
  .rank-table tr:last-child td { border-bottom: none; }
  .rank-table tr:hover { background: #f0e8d8; }
  .rank-num { width: 32px; font-weight: 700; color: var(--muted); text-align: center; }
  .rank-num.r1 { color: var(--gold); font-size: 16px; }
  .rank-num.r2 { color: var(--silver); font-size: 15px; }
  .rank-num.r3 { color: var(--bronze); font-size: 14px; }
  .rank-name { font-weight: 600; }
  .rank-name a { color: var(--text); text-decoration: none; }
  .rank-name a:hover { color: var(--primary); text-decoration: underline; }
  .rank-debut { font-size: 11px; color: var(--muted); margin-left: 6px; }
  .rank-val { text-align: right; font-weight: 700; font-size: 15px; min-width: 70px; color: var(--primary); }
  .rank-val.top { color: var(--accent); font-size: 17px; }
  .rank-sub { font-size: 10px; color: var(--muted); text-align: right; }
  .medal { margin-right: 2px; }

  /* Qualifier note */
  .qualifier-note { font-size: 12px; color: var(--muted); margin-top: 8px; margin-bottom: 20px; }

  @media (max-width: 700px) {
    .rank-grid { grid-template-columns: 1fr; }
    .main { padding: 12px; }
    .cat-tab { padding: 8px 12px; font-size: 12px; }
  }
</style>
</head>

<header>
  <div class="header-inner">
    <div class="site-logo">バミューダ<span>ドルフィンズ</span></div>
    <nav class="nav-links">

</div>

const TOP = 30;

function showCat(id) {
  document.querySelectorAll('.cat-section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('cat-' + id).classList.add('active');
  event.target.classList.add('active');
}

function medal(rank) {
  if (rank === 1) return '<span class="medal">🥇</span>';
  if (rank === 2) return '<span class="medal">🥈</span>';
  if (rank === 3) return '<span class="medal">🥉</span>';
  return '';
}

function rankClass(rank) {
  if (rank === 1) return 'r1';
  if (rank === 2) return 'r2';
  if (rank === 3) return 'r3';
  return '';
}

function fmtVal(v, key) {
  if (v === null || v === undefined) return '-';
  if (key === 'avg' || key === 'obp') return v.toFixed(3).replace(/^0/,'');
  if (key === 'era') return v.toFixed(2);
  if (key === 'ip') return v.toFixed(1);
  return v;
}

function subInfo(row, key) {
  if (key === 'avg') return row.ab + ' AB / ' + row.h + ' H';
  if (key === 'obp') return row.ab + ' AB・' + row.bb + ' BB';
  if (key === 'era') return row.ip.toFixed(1) + ' IP / ' + row.er + ' 自責';
  if (key === 'h')   return '単打' + row.h1 + ' 2B' + row.d + ' 3B' + row.t + ' HR' + row.hr;
  return row.yrs + '年間';
}

function buildRankCard(title, data, key, sortAsc, note) {
  const valid = data.filter(r => r[key] !== null && r[key] !== undefined);
  const sorted = [...valid].sort((a,b) => sortAsc ? a[key]-b[key] : b[key]-a[key]);
  const top = sorted.slice(0, TOP);

  let rows = '';
  let prevVal = null, dispRank = 0, trueRank = 0;
  top.forEach((row, i) => {
    trueRank++;
    if (row[key] !== prevVal) { dispRank = trueRank; prevVal = row[key]; }
    const isTop = dispRank <= 3;
    rows += `<tr>
      <td class="rank-num ${rankClass(dispRank)}">${medal(dispRank)}${dispRank}</td>
      <td class="rank-name">
        <a href="players.html" onclick="openPlayer(${row.id});return false;">${row.name}</a>
        <span class="rank-debut">${row.debut || ''}年〜</span>
      </td>
      <td class="rank-val${isTop?' top':''}">${fmtVal(row[key], key)}</td>
      <td class="rank-sub">${subInfo(row, key)}</td>
    </tr>`;
  });

  return `<div class="rank-card">
    <div class="rank-card-header">
      <span class="rank-card-title">${title}</span>
      ${note ? `<span class="rank-card-note">${note}</span>` : ''}
    </div>
    <table class="rank-table"><tbody>${rows}</tbody></table>
  </div>`;
}

function renderAll() {
  // --- 打撃 数量 ---
  const batCount = [
    ['試合数',   BAT, 'g',   false, ''],
    ['打席数',   BAT, 'pa',  false, ''],
    ['打数',     BAT, 'ab',  false, ''],
    ['得点',     BAT, 'r',   false, ''],
    ['安打',     BAT, 'h',   false, '単打+2B+3B+HR'],
    ['単打',     BAT, 'h1',  false, ''],
    ['２塁打',   BAT, 'd',   false, ''],
    ['３塁打',   BAT, 't',   false, ''],
    ['本塁打',   BAT, 'hr',  false, ''],
    ['打点',     BAT, 'rbi', false, ''],
    ['盗塁',     BAT, 'sb',  false, ''],
    ['犠打',     BAT, 'sac', false, ''],
    ['四死球',   BAT, 'bb',  false, ''],
    ['三振',     BAT, 'so',  false, '最多'],
  ];
  document.getElementById('grid-bat-count').innerHTML =
    batCount.map(([t,d,k,asc,n]) => buildRankCard(t,d,k,asc,n)).join('');

  // --- 打撃 率 ---
  const batRate = [
    ['打率',   BAT.filter(r=>r.avg!==null),  'avg',  false, '通算30AB以上'],
    ['出塁率', BAT.filter(r=>r.obp!==null),  'obp',  false, '通算30AB以上'],
  ];
  document.getElementById('grid-bat-rate').innerHTML =
    batRate.map(([t,d,k,asc,n]) => buildRankCard(t,d,k,asc,n)).join('');

  // --- 投手 数量 ---
  const pitCount = [
    ['登板数',   PIT, 'g',  false, ''],
    ['勝利',     PIT, 'w',  false, ''],
    ['敗戦',     PIT, 'l',  false, '最多'],
    ['セーブ',   PIT, 'sv', false, ''],
    ['投球回',   PIT, 'ip', false, ''],
    ['奪三振',   PIT, 'k',  false, ''],
    ['被安打',   PIT, 'h',  false, '最多'],
    ['四死球',   PIT, 'bb', false, '最多（許）'],
    ['失点',     PIT, 'r',  false, '最多'],
    ['自責点',   PIT, 'er', false, '最多'],
  ];
  document.getElementById('grid-pit-count').innerHTML =
    pitCount.map(([t,d,k,asc,n]) => buildRankCard(t,d,k,asc,n)).join('');

  // --- 投手 率 ---
  const pitRate = [
    ['防御率（低順）', PIT.filter(r=>r.era!==null), 'era', true, '通算14IP以上'],
  ];
  document.getElementById('grid-pit-rate').innerHTML =
    pitRate.map(([t,d,k,asc,n]) => buildRankCard(t,d,k,asc,n)).join('');
}

// Cross-page player link
function openPlayer(id) {
  window.location.href = 'players.html#player=' + id;
}

renderAll();
</script>
